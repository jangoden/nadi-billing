<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgTax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="50%" stop-color="#0f2240" />
      <stop offset="100%" stop-color="#14315c" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="taxBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgTax)" />

  <!-- Ambient background glow -->
  <circle cx="350" cy="300" r="260" fill="#10b981" opacity="0.12" filter="url(#taxBlur)" />
  <circle cx="850" cy="350" r="260" fill="#2563eb" opacity="0.15" filter="url(#taxBlur)" />

  <!-- Main Invoice Document Frame -->
  <g transform="translate(240, 75)">
    <!-- Main Paper/Card Container -->
    <rect width="720" height="525" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Top Header Bar -->
    <rect x="0" y="0" width="720" height="85" rx="18" fill="#f8fafc" />
    <!-- Logo & Title -->
    <rect x="36" y="24" width="38" height="38" rx="8" fill="#2563eb" />
    <text x="55" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle">N</text>
    <text x="86" y="42" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">FAKTUR PAJAK &amp; INVOICE KOMERSIAL</text>
    <text x="86" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STANDAR PERATURAN PERPAJAKAN ISP INDONESIA</text>

    <!-- Verified Badge Top Right -->
    <g transform="translate(530, 24)">
      <rect width="154" height="36" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
      <circle cx="22" cy="18" r="8" fill="#10b981" />
      <path d="M 18 18 L 21 21 L 27 15" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="36" y="23" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="800">E-FAKTUR READY</text>
    </g>

    <line x1="0" y1="85" x2="720" y2="85" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Invoice Data Grid -->
    <g transform="translate(36, 110)">
      <!-- Details Row -->
      <g>
        <text x="0" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">NO. SERI FAKTUR / INVOICE</text>
        <text x="0" y="36" fill="#0f172a" font-family="monospace" font-size="14" font-weight="800">INV-2026-PPN-00981</text>

        <text x="240" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">NPWP BADAN USAHA</text>
        <text x="240" y="36" fill="#0f172a" font-family="monospace" font-size="14" font-weight="800">01.892.410.2-041.000</text>

        <text x="480" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PERIODE TAGIHAN</text>
        <text x="480" y="36" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">September 2026</text>
      </g>

      <!-- Table Header -->
      <g transform="translate(0, 60)">
        <rect width="648" height="34" rx="6" fill="#f1f5f9" />
        <text x="16" y="22" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DESKRIPSI LAYANAN ISP</text>
        <text x="320" y="22" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TARIF PPN</text>
        <text x="460" y="22" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">DPP (DASAR PENGENAAN)</text>
        <text x="632" y="22" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">TOTAL (IDR)</text>

        <!-- Table Row 1 -->
        <g transform="translate(0, 44)">
          <text x="16" y="22" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Paket Internet Fiber Dedicated 100 Mbps</text>
          <text x="16" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Kategori Jasa Telekomunikasi KBLI 61999</text>
          
          <rect x="290" y="10" width="60" height="22" rx="4" fill="#eff6ff" />
          <text x="320" y="25" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">11% / 12%</text>

          <text x="460" y="24" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Rp 2.500.000</text>
          <text x="632" y="24" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="end">Rp 2.775.000</text>
          <line x1="0" y1="52" x2="648" y2="52" stroke="#f1f5f9" stroke-width="1.5" />
        </g>
      </g>

      <!-- Financial Calculation Summary Box -->
      <g transform="translate(320, 195)">
        <rect width="328" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <g transform="translate(16, 20)">
          <text x="0" y="14" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Subtotal Dasar Pengenaan (DPP):</text>
          <text x="296" y="14" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">Rp 2.500.000</text>

          <text x="0" y="44" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Pajak Pertambahan Nilai (PPN 11%):</text>
          <text x="296" y="44" fill="#2563eb" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">Rp 275.000</text>

          <line x1="0" y1="62" x2="296" y2="62" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4" />

          <text x="0" y="86" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">TOTAL TAGIHAN LUNAS:</text>
          <text x="296" y="86" fill="#10b981" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="end">Rp 2.775.000</text>
          <text x="0" y="104" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Termasuk rincian faktur pajak resmi</text>
        </g>
      </g>

      <!-- Seal / QR Stamp on Left -->
      <g transform="translate(10, 200)">
        <rect width="260" height="140" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
        <circle cx="50" cy="70" r="28" fill="#2563eb" />
        <path d="M 40 70 L 47 77 L 62 62" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <text x="92" y="58" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="12" font-weight="800">TERVERIFIKASI SISTEM</text>
        <text x="92" y="76" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">NADI Cloud Financial</text>
        <text x="92" y="94" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Kepatuhan SPT Masa PPN</text>
      </g>
    </g>
  </g>
</svg>
