<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091224" />
      <stop offset="50%" stop-color="#0f1f3d" />
      <stop offset="100%" stop-color="#142852" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
    <filter id="blurB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="300" cy="200" r="240" fill="#2563eb" opacity="0.18" filter="url(#blurB)" />
  <circle cx="950" cy="450" r="260" fill="#06b6d4" opacity="0.15" filter="url(#blurB)" />

  <!-- Main Unified Dashboard Window -->
  <g transform="translate(180, 85)">
    <!-- Window Container -->
    <rect width="840" height="505" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <path d="M 0 20 C 0 8.954 8.954 0 20 0 L 820 0 C 831.046 0 840 8.954 840 20 L 840 50 L 0 50 Z" fill="#0f172a" />
    <circle cx="28" cy="25" r="6" fill="#ef4444" />
    <circle cx="48" cy="25" r="6" fill="#f59e0b" />
    <circle cx="68" cy="25" r="6" fill="#10b981" />
    <rect x="280" y="14" width="280" height="22" rx="6" fill="#1e293b" />
    <text x="420" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">nadi-billing.id/dashboard/all-in-one</text>

    <!-- Top KPI Row -->
    <g transform="translate(30, 75)">
      <!-- KPI 1 -->
      <rect width="240" height="100" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PENDAPATAN BULANAN</text>
      <text x="20" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Rp 84.500.000</text>
      <text x="20" y="88" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">&#9650; +38.4% vs software terpisah</text>

      <!-- KPI 2 -->
      <g transform="translate(270, 0)">
        <rect width="240" height="100" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PELANGGAN TERHUBUNG</text>
        <text x="20" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">1.842 Aktif</text>
        <text x="20" y="88" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="11" font-weight="700">&#9679; 100% Sync RADIUS</text>
      </g>

      <!-- KPI 3 -->
      <g transform="translate(540, 0)">
        <rect width="240" height="100" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">EFISIENSI BIAYA (TCO)</text>
        <text x="20" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Hemat 55%</text>
        <text x="20" y="88" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">1 Vendor bukan 4 Vendor</text>
      </g>
    </g>

    <!-- Chart & Modules Section -->
    <g transform="translate(30, 200)">
      <!-- Left Chart Area -->
      <rect width="510" height="270" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="24" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Pertumbuhan Cashflow &amp; Otomasi Penagihan</text>
      
      <!-- Chart Area -->
      <path d="M 40 210 Q 140 180, 220 140 T 360 90 T 470 50 L 470 230 L 40 230 Z" fill="url(#chartGrad)" />
      <path d="M 40 210 Q 140 180, 220 140 T 360 90 T 470 50" fill="none" stroke="#06b6d4" stroke-width="3.5" />
      
      <!-- Chart Points -->
      <circle cx="220" cy="140" r="5" fill="#ffffff" stroke="#06b6d4" stroke-width="2.5" />
      <circle cx="360" cy="90" r="5" fill="#ffffff" stroke="#06b6d4" stroke-width="2.5" />
      <circle cx="470" cy="50" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2" />
      
      <text x="40" y="250" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Januari</text>
      <text x="180" y="250" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">April</text>
      <text x="320" y="250" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Juli</text>
      <text x="440" y="250" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="700">September (NADI)</text>

      <!-- Right 4 Integrated Nodes -->
      <g transform="translate(540, 0)">
        <rect width="240" height="270" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
        <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">4 MODUL TERINTEGRASI</text>

        <!-- Node 1 -->
        <g transform="translate(16, 50)">
          <rect width="208" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <circle cx="22" cy="21" r="5" fill="#10b981" />
          <text x="36" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Cloud Billing &amp; Invoice</text>
        </g>
        <!-- Node 2 -->
        <g transform="translate(16, 102)">
          <rect width="208" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <circle cx="22" cy="21" r="5" fill="#06b6d4" />
          <text x="36" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">MikroTik RADIUS AAA</text>
        </g>
        <!-- Node 3 -->
        <g transform="translate(16, 154)">
          <rect width="208" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <circle cx="22" cy="21" r="5" fill="#2563eb" />
          <text x="36" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">WhatsApp Gateway Bot</text>
        </g>
        <!-- Node 4 -->
        <g transform="translate(16, 206)">
          <rect width="208" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <circle cx="22" cy="21" r="5" fill="#f59e0b" />
          <text x="36" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">QRIS &amp; Bank Gateway</text>
        </g>
      </g>
    </g>
  </g>
</svg>
